[package]
name = "bi_fs_rs"
version = "1.0.1"
edition = "2024"
authors = ["Perondas <thomas@perondas.dev>"]
license = "GPL-3.0"
description = "A Rust library for working with Arma 3 related file formats, such as PBO and BISIGN files."
repository = "https://github.com/Perondas/bi_fs_rs"
categories = ["filesystem", "game-development"]
keywords = ["arma3", "pbo", "bisign", "file-formats"]
readme = "README.md"

[dependencies]
anyhow = "1.0.98"
rsa = "0.9.10"
sha1 = "0.11.0"
binrw = "0.15.2"
nutype = "0.8.0"
# Must stay on the same rand_core version as the rsa crate
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
